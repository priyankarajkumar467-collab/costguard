version: '3.8'

services:
  costguard-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - COSTGUARD_CACHE_DB=/data/pricing_cache.db
      - AZURE_PRICES_API_URL=https://prices.azure.com/api/retail/prices
      - COSTGUARD_MAX_INCREASE=50.0
    volumes:
      - costguard-data:/data

  costguard-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - costguard-backend

volumes:
  costguard-data:
